<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KasKu - Pencatat Keuangan Merah Putih Kuning</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-red-950 text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- Mobile Frame Container -->
    <div class="w-full sm:max-w-md bg-stone-900 sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col h-screen sm:h-[850px] border border-amber-500/30">
        
        <!-- Header: Kombinasi Merah & Kuning Elegan -->
        <div class="bg-gradient-to-r from-red-700 via-red-600 to-amber-500 p-6 text-white rounded-b-3xl shadow-lg relative">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-xs uppercase tracking-wider text-amber-200 font-semibold flex items-center gap-1">
                        <span class="w-2.5 h-2.5 rounded-full bg-white inline-block"></span> Dompet Digital
                    </h1>
                    <div class="flex items-center gap-2 mt-0.5">
                        <h2 id="wallet-title-display" class="text-2xl font-black text-white tracking-wide">KAS-KU</h2>
                        <button onclick="openEditWalletModal()" class="text-amber-200 hover:text-white text-xs bg-black/20 p-1.5 rounded-lg transition" title="Ganti Nama Dompet">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                    </div>
                </div>
                <button onclick="exportToExcel()" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-xl text-sm font-medium flex items-center gap-2 backdrop-blur-md transition border border-white/20 shadow-sm">
                    <i class="fa-solid fa-file-excel text-amber-300"></i> Ekspor Excel
                </button>
            </div>

            <!-- Card Saldo -->
            <div class="bg-black/20 backdrop-blur-md p-4 rounded-2xl border border-amber-400/30 mt-2 shadow-inner">
                <p class="text-xs text-amber-200 font-medium">Total Saldo Bersih</p>
                <h3 id="total-balance" class="text-3xl font-extrabold mt-1 text-amber-300">Rp 0</h3>
                <div class="grid grid-cols-2 gap-4 mt-4 pt-3 border-t border-white/10">
                    <div>
                        <div class="flex items-center gap-1.5 text-amber-300 text-xs font-semibold">
                            <i class="fa-solid fa-arrow-down-long"></i> Pemasukan
                        </div>
                        <p id="total-income" class="text-base font-bold mt-0.5 text-white">Rp 0</p>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5 text-red-300 text-xs font-semibold">
                            <i class="fa-solid fa-arrow-up-long"></i> Pengeluaran
                        </div>
                        <p id="total-expense" class="text-base font-bold mt-0.5 text-white">Rp 0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Scrollable -->
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            
            <!-- Form Input Transaksi -->
            <div class="bg-stone-800/80 p-4 rounded-2xl border border-amber-500/20 shadow-md">
                <h3 class="text-sm font-bold text-amber-400 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus text-amber-400"></i> Tambah Transaksi Baru
                </h3>
                <form id="transaction-form" class="space-y-3">
                    <div>
                        <label class="block text-xs text-stone-300 mb-1">Keterangan</label>
                        <input type="text" id="description" required placeholder="Contoh: Gaji Bulanan, Makan Siang" 
                            class="w-full bg-stone-900 border border-stone-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-stone-300 mb-1">Nominal (Rp)</label>
                            <input type="text" id="amount-formatted" required placeholder="1.400.000" 
                                class="w-full bg-stone-900 border border-stone-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                            <!-- Hidden actual value input -->
                            <input type="hidden" id="amount" value="">
                        </div>
                        <div>
                            <label class="block text-xs text-stone-300 mb-1">Jenis</label>
                            <select id="type" class="w-full bg-stone-900 border border-stone-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                                <option value="income">Uang Masuk</option>
                                <option value="expense">Uang Keluar</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-stone-300 mb-1">Kategori</label>
                        <select id="category" class="w-full bg-stone-900 border border-stone-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                            <option value="Gaji">Gaji / Pendapatan</option>
                            <option value="Makanan">Makanan & Minuman</option>
                            <option value="Transportasi">Transportasi</option>
                            <option value="Belanja">Belanja</option>
                            <option value="Tagihan">Tagihan & Utilitas</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-amber-500 hover:from-red-700 hover:to-amber-600 text-white font-bold py-2.5 rounded-xl transition text-sm shadow-lg shadow-amber-500/20">
                        Simpan Transaksi
                    </button>
                </form>
            </div>

            <!-- Filter & Riwayat -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-amber-400">Riwayat Transaksi</h3>
                    <select id="filter-type" onchange="filterTransactions()" class="bg-stone-800 border border-stone-700 text-xs text-amber-300 rounded-lg px-2 py-1 focus:outline-none">
                        <option value="all">Semua</option>
                        <option value="income">Masuk</option>
                        <option value="expense">Keluar</option>
                    </select>
                </div>
                
                <div id="transaction-list" class="space-y-2.5">
                    <!-- Dynamic Items -->
                </div>
            </div>

        </div>
    </div>

    <!-- Modal Ganti Nama Dompet -->
    <div id="wallet-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-stone-900 border border-amber-500/30 rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-amber-400">Ganti Nama Dompet</h3>
            <div>
                <label class="block text-xs text-stone-300 mb-1">Nama Dompet / Kas Baru</label>
                <input type="text" id="wallet-name-input" placeholder="Contoh: Dompet Toko, Kas Pribadi" 
                    class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeEditWalletModal()" class="flex-1 bg-stone-800 hover:bg-stone-700 text-stone-300 font-semibold py-2 rounded-xl text-sm transition">
                    Batal
                </button>
                <button onclick="saveWalletName()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold py-2 rounded-xl text-sm transition">
                    Simpan
                </button>
            </div>
        </div>
    </div>

    <!-- Script Aplikasi -->
    <script>
        let transactions = JSON.parse(localStorage.getItem('kasku_transactions')) || [];
        let walletName = localStorage.getItem('kasku_wallet_name') || 'KAS-KU';

        const walletTitleDisplay = document.getElementById('wallet-title-display');
        const walletModal = document.getElementById('wallet-modal');
        const walletNameInput = document.getElementById('wallet-name-input');

        walletTitleDisplay.textContent = walletName;

        function openEditWalletModal() {
            walletNameInput.value = walletName;
            walletModal.classList.remove('hidden');
            walletModal.classList.add('flex');
        }

        function closeEditWalletModal() {
            walletModal.classList.remove('flex');
            walletModal.classList.add('hidden');
        }

        function saveWalletName() {
            const newName = walletNameInput.value.trim();
            if (newName) {
                walletName = newName;
                walletTitleDisplay.textContent = walletName;
                localStorage.setItem('kasku_wallet_name', walletName);
            }
            closeEditWalletModal();
        }

        const form = document.getElementById('transaction-form');
        const descInput = document.getElementById('description');
        const amountFormattedInput = document.getElementById('amount-formatted');
        const amountInput = document.getElementById('amount');
        const typeInput = document.getElementById('type');
        const categoryInput = document.getElementById('category');
        
        const totalBalanceEl = document.getElementById('total-balance');
        const totalIncomeEl = document.getElementById('total-income');
        const totalExpenseEl = document.getElementById('total-expense');
        const transactionListEl = document.getElementById('transaction-list');
        const filterTypeEl = document.getElementById('filter-type');

        // Auto format input nominal with dots (e.g. 1.400.000)
        amountFormattedInput.addEventListener('input', function (e) {
            let val = this.value.replace(/[^,\d]/g, '').toString();
            let split = val.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }

            rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah;
            this.value = rupiah;
            
            // Simpan nilai asli tanpa titik ke hidden input
            amountInput.value = val.replace(/\./g, '');
        });

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        function updateUI() {
            let income = 0;
            let expense = 0;

            transactions.forEach(t => {
                if (t.type === 'income') {
                    income += Number(t.amount);
                } else {
                    expense += Number(t.amount);
                }
            });

            const balance = income - expense;

            totalBalanceEl.textContent = formatRupiah(balance);
            totalIncomeEl.textContent = formatRupiah(income);
            totalExpenseEl.textContent = formatRupiah(expense);

            renderTransactions(transactions);
            localStorage.setItem('kasku_transactions', JSON.stringify(transactions));
        }

        function renderTransactions(data) {
            transactionListEl.innerHTML = '';

            if (data.length === 0) {
                transactionListEl.innerHTML = `
                    <div class="text-center py-8 text-stone-500 text-sm">
                        Belum ada transaksi tercatat.
                    </div>
                `;
                return;
            }

            // Urutkan dari terbaru
            const sorted = [...data].reverse();

            sorted.forEach((t) => {
                const isIncome = t.type === 'income';
                const itemEl = document.createElement('div');
                itemEl.className = "bg-stone-800/60 border border-stone-700/60 p-3 rounded-xl flex items-center justify-between hover:bg-stone-800 transition";
                
                itemEl.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center ${isIncome ? 'bg-amber-500/10 text-amber-400' : 'bg-red-500/10 text-red-400'}">
                            <i class="fa-solid ${isIncome ? 'fa-arrow-down-long' : 'fa-arrow-up-long'}"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-semibold text-white">${t.description}</h4>
                            <p class="text-xs text-stone-400">${t.category} • ${t.date}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-bold ${isIncome ? 'text-amber-400' : 'text-red-400'}">
                            ${isIncome ? '+' : '-'} ${formatRupiah(t.amount)}
                        </span>
                        <button onclick="deleteTransaction('${t.id}')" class="text-stone-500 hover:text-red-400 transition text-xs p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                transactionListEl.appendChild(itemEl);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const rawAmount = amountInput.value;
            if (!rawAmount || Number(rawAmount) <= 0) {
                alert('Masukkan nominal yang valid!');
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

            const newTransaction = {
                id: Date.now().toString(),
                description: descInput.value,
                amount: Number(rawAmount),
                type: typeInput.value,
                category: categoryInput.value,
                date: dateStr
            };

            transactions.push(newTransaction);
            updateUI();
            form.reset();
            amountInput.value = '';
        });

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            updateUI();
        }

        function filterTransactions() {
            const filter = filterTypeEl.value;
            if (filter === 'all') {
                renderTransactions(transactions);
            } else {
                const filtered = transactions.filter(t => t.type === filter);
                renderTransactions(filtered);
            }
        }

        function exportToExcel() {
            if (transactions.length === 0) {
                alert('Tidak ada data transaksi untuk diekspor!');
                return;
            }

            const dataToExport = transactions.map((t, index) => ({
                No: index + 1,
                Tanggal: t.date,
                Keterangan: t.description,
                Kategori: t.category,
                Jenis: t.type === 'income' ? 'Uang Masuk' : 'Uang Keluar',
                Nominal: t.amount
            }));

            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Keuangan");

            XLSX.writeFile(workbook, "Laporan_Keuangan_KasKu.xlsx");
        }

        // Inisialisasi awal
        updateUI();
    </script>
</body>
</html>
